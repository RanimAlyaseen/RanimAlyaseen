<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Technical trajectory</title>
  <desc id="desc">Software engineering foundations connect to complete systems and then applied machine learning and NLP.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08182c"/>
      <stop offset="1" stop-color="#0b2741"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#258cff"/>
      <stop offset="1" stop-color="#39e6df"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="168" rx="24" fill="url(#panel)" stroke="#1d4668" stroke-width="2"/>
  <path d="M205 84 H995" stroke="#143c59" stroke-width="6" stroke-linecap="round"/>
  <path d="M205 84 H995" stroke="url(#line)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#08182c" stroke="#35cbe1" stroke-width="3">
    <circle cx="205" cy="84" r="10"/><circle cx="600" cy="84" r="10"/><circle cx="995" cy="84" r="10"/>
  </g>
  <g fill="#f4fbff" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="205" y="55" font-size="18" font-weight="700" letter-spacing="1.2">FOUNDATIONS</text>
    <text x="205" y="122" fill="#a9c5d8" font-size="15">data · backend · architecture</text>
    <text x="600" y="55" font-size="18" font-weight="700" letter-spacing="1.2">COMPLETE SYSTEMS</text>
    <text x="600" y="122" fill="#a9c5d8" font-size="15">interfaces · workflows · testing</text>
    <text x="995" y="55" font-size="18" font-weight="700" letter-spacing="1.2">APPLIED ML + NLP</text>
    <text x="995" y="122" fill="#a9c5d8" font-size="15">experiments · evaluation · limits</text>
  </g>
</svg>
