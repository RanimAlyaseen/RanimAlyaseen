<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc">
  <title id="title">Technical trajectory</title>
  <desc id="desc">Software engineering foundations progress to full-stack systems and then applied machine learning and NLP.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08182c"/>
      <stop offset="1" stop-color="#0b2741"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#258cff"/>
      <stop offset="1" stop-color="#39e6df"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-30%" width="300%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="24" fill="url(#panel)" stroke="#1d4668" stroke-width="2"/>
  <path d="M86 70 V260" stroke="#143c59" stroke-width="6" stroke-linecap="round"/>
  <path d="M86 70 V260" stroke="url(#line)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#08182c" stroke="#35cbe1" stroke-width="3">
    <circle cx="86" cy="70" r="10"/><circle cx="86" cy="165" r="10"/><circle cx="86" cy="260" r="10"/>
  </g>
  <g fill="#f4fbff" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="125" y="64" font-size="26" font-weight="700" letter-spacing="1.1">SOFTWARE ENGINEERING</text>
    <text x="125" y="87" fill="#a9c5d8" font-size="17">data · backend · architecture</text>
    <text x="125" y="159" font-size="26" font-weight="700" letter-spacing="1.1">FULL-STACK SYSTEMS</text>
    <text x="125" y="182" fill="#a9c5d8" font-size="17">interfaces · workflows · testing</text>
    <text x="125" y="254" font-size="26" font-weight="700" letter-spacing="1.1">APPLIED ML + NLP</text>
    <text x="125" y="277" fill="#a9c5d8" font-size="17">experiments · evaluation · limits</text>
  </g>
</svg>
