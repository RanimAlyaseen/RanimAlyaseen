name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Build the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#4cc9f0&color_dots=#2d1b4e,#5b2a6e,#a23e6c,#e8683a,#f2c94c&color_dot_border=#140a26
      - name: Add a pixel-style frame behind the snake
        run: |
          python3 - <<'PY'
          import re
          s = open("dist/snake.svg").read()
          x, y, w, h = [float(v) for v in re.search(r'viewBox="([^"]+)"', s).group(1).split()]
          bg = (f'<rect x="{x}" y="{y}" width="{w}" height="{h}" fill="#140a26"/>'
                f'<rect x="{x+2}" y="{y+2}" width="{w-4}" height="{h-4}" fill="none" stroke="#5b2a6e" stroke-width="4"/>')
          s = re.sub(r'(<svg[^>]*>)', lambda m: m.group(1) + bg, s, count=1)
          open("dist/snake.svg", "w").write(s)
          PY
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
